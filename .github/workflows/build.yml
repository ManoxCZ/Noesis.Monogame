name: Build and Test

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Setup SPIR-V Enabled DXC
      shell: powershell
      run: |
        # Install the Microsoft DirectX Shader Compiler package containing DXC and SPIRV-cross capability
        nuget install Microsoft.Direct3D.DXC -Version 1.7.2308 -OutputDirectory .dxc
          
        # Find the exact path to the bin folder containing dxc.exe
        $dxcFolder = (Get-ChildItem -Path ".dxc" -Filter "dxc.exe" -Recurse).DirectoryName | Select-Object -First 1
          
        if ($dxcFolder) {
          Write-Host "Adding DXC to PATH: $dxcFolder"
          Add-Content -Path $env:GITHUB_PATH -Value $dxcFolder
        } else {
          Write-Error "Could not locate dxc.exe inside downloaded NuGet package."
        }

    - name: Build package
      run: build_package.bat
      shell: cmd

    - name: List generated artifacts
      run: |
        Get-ChildItem -Path . -Filter "*.nupkg" -Recurse | Select-Object FullName
      shell: pwsh
