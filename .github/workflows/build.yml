name: Build and Test

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
# Locate dxc.exe in the Windows SDK installation on the runner and add to PATH
    - name: Add DXC (DirectX Shader Compiler) to PATH
      shell: powershell
      run: |
        $dxc = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "dxc.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
        if ($dxc) {
          $dxcPath = $dxc.DirectoryName
          Write-Host "Found DXC at: $dxcPath"
          Add-Content -Path $env:GITHUB_PATH -Value $dxcPath
        } else {
          Write-Error "dxc.exe could not be found in Windows SDK x64 installation."
        }

    - name: Build package
      run: build_package.bat
      shell: cmd

    - name: List generated artifacts
      run: |
        Get-ChildItem -Path . -Filter "*.nupkg" -Recurse | Select-Object FullName
      shell: pwsh
