name: Build and Publish NuGet Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (optional, will use nuspec version if not provided)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup NuGet CLI
      uses: NuGet/setup-nuget@v1

    - name: Download and Setup SPIR-V Enabled DXC
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Fetching latest DirectX Shader Compiler release from GitHub..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          
        if (-not $asset) {
            throw "Could not find a valid release asset zip."
        }
          
        Write-Host "Downloading asset: $($asset.name)..."
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "dxc.zip"
          
        Write-Host "Extracting files..."
        Expand-Archive -Path "dxc.zip" -DestinationPath ".dxc" -Force
          
        $dxcExe = Get-ChildItem -Path ".dxc\bin\x64" -Filter "dxc.exe" -ErrorAction SilentlyContinue
        if (-not $dxcExe) {
            $dxcExe = Get-ChildItem -Path ".dxc" -Filter "dxc.exe" -Recurse | Where-Object { $_.DirectoryName -match '\\x64\\' } | Select-Object -First 1
        }
        if ($dxcExe) {
            $dxcFolder = $dxcExe.DirectoryName
            Write-Host "Successfully found dxc.exe at: $dxcFolder"
            Add-Content -Path $env:GITHUB_PATH -Value $dxcFolder
        } else {
            throw "dxc.exe could not be located inside the extracted archive."
        }

    - name: Build package
      run: build_package.bat
      shell: cmd

    - name: List generated packages
      run: |
        Get-ChildItem -Path . -Filter "*.nupkg" -Recurse | Select-Object FullName
      shell: pwsh

    - name: Publish to NuGet
      if: github.event_name != 'pull_request'
      id: publish
      uses: actions/github-script@v7
      with:
        script: |
          const core = require('@actions/core');
          const { context } = require('@actions/github');
          
          // Get OIDC token for NuGet
          const oidcToken = await core.getIDToken('https://api.nuget.org');
          
          // Find and publish the package
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          
          const nupkgFiles = execSync('Get-ChildItem -Path . -Filter "*.nupkg" -Recurse | Select-Object -First 1 | Select-Object -ExpandProperty FullName', { encoding: 'utf-16' }).trim();
          
          if (!nupkgFiles) {
            core.setFailed('No .nupkg file found');
            return;
          }
          
          console.log(`Publishing ${nupkgFiles} to NuGet using Trusted Publishing...`);
          execSync(`nuget push "${nupkgFiles}" -ApiKey ${oidcToken} -Source https://api.nuget.org/v3/index.json -SkipDuplicate`, { stdio: 'inherit' });
