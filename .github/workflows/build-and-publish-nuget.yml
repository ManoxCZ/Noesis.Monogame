name: Build and Publish NuGet Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (optional, will use nuspec version if not provided)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Download and Setup SPIR-V Enabled DXC
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Fetching latest DirectX Shader Compiler release from GitHub..."
        $release = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/DirectXShaderCompiler/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          
        if (-not $asset) {
            throw "Could not find a valid release asset zip."
        }
          
        Write-Host "Downloading asset: $($asset.name)..."
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "dxc.zip"
          
        Write-Host "Extracting files..."
        Expand-Archive -Path "dxc.zip" -DestinationPath ".dxc" -Force
          
        $dxcExe = Get-ChildItem -Path ".dxc\bin\x64" -Filter "dxc.exe" -ErrorAction SilentlyContinue
        if (-not $dxcExe) {
            $dxcExe = Get-ChildItem -Path ".dxc" -Filter "dxc.exe" -Recurse | Where-Object { $_.DirectoryName -match '\\x64\\' } | Select-Object -First 1
        }
        if ($dxcExe) {
            $dxcFolder = $dxcExe.DirectoryName
            Write-Host "Successfully found dxc.exe at: $dxcFolder"
            Add-Content -Path $env:GITHUB_PATH -Value $dxcFolder
        } else {
            throw "dxc.exe could not be located inside the extracted archive."
        }

    - name: Build package
      run: build_package.bat
      shell: cmd

    - name: List generated packages
      id: list_packages
      run: |
        $package = Get-ChildItem -Path . -Filter "ManoxCZ.Noesis.MonoGame.*.nupkg" -Recurse | Select-Object -First 1
        if ($package) {
          echo "package_path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Found package: $($package.Name)"
        } else {
          throw "No ManoxCZ.Noesis.MonoGame.*.nupkg file found"
        }
      shell: pwsh

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ManoxCZ # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
    
    # Push the package
    - name: NuGet push
      run: dotnet nuget push "${{ steps.list_packages.outputs.package_path }}" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
